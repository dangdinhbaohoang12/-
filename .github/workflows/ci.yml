name: CI - Build & Test (Offshore PTW)

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    name: Typecheck / Test / Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: offshore-ptw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: offshore-ptw/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ptw-dist
          path: offshore-ptw/dist
