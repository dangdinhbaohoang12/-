name: GitHub Automation Bot

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  automation:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Process Issues and Pull Requests
        uses: actions/github-script@v7
        with:
          script: |
            const eventName = context.eventName;
            
            // 1. XỬ LÝ KHI CÓ ISSUE MỚI
            if (eventName === 'issues') {
              const issueTitle = context.payload.issue.title || "";
              const issueNumber = context.issue.number;
              
              // Nội dung bình luận mặc định
              const welcomeMessage = `Cảm ơn bạn đã báo cáo vấn đề. Nếu như đó là vấn đề sửa, vui lòng ghi \`fix:...\`, còn không thì ghi \`chore:\`.
              
              Nếu bạn biết cách sửa, hoan nghênh các đóng góp. Bạn có thể đóng góp tại yêu cầu kéo này: https://github.com`;
              
              // Gửi bình luận chào mừng
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: welcomeMessage
              });
              
              // Kiểm tra tiêu đề để dán nhãn tương ứng (Không phân biệt chữ hoa/thường)
              let labelToAdd = "";
              if (issueTitle.toLowerCase().startsWith('fix:')) {
                labelToAdd = "high priority"; // Ưu tiên cao
              } else if (issueTitle.toLowerCase().startsWith('chore:')) {
                labelToAdd = "low priority"; // Ưu tiên thấp
              }
              
              // Nếu khớp từ khóa thì tiến hành dán nhãn
              if (labelToAdd) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: [labelToAdd]
                });
              }
            }
            
            // 2. XỬ LÝ KHI CÓ PULL REQUEST (YÊU CẦU KÉO) MỚI
            if (eventName === 'pull_request') {
              const prNumber = context.payload.pull_request.number;
              
              const prMessage = `đây chỉ là nhãn dán để tránh Ai cubic bình luận quá nhiều, code không hề có vấn đề gì cả. nó sẽ được hạ xuống khi chủ kho lưu trữ hạ.`;
              
              // Gửi thông báo trong Pull Request
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: prMessage
              });
              
              // Tự động dán nhãn skip-review
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ['skip-review']
              });
            }
