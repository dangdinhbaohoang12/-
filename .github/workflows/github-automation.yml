name: GitHub Automation Bot

on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened]
  workflow_dispatch:

jobs:
  automation:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Process Issues and Pull Requests
        uses: actions/github-script@v7
        with:
          script: |
            const eventName = context.eventName;
            
            // 1. XỬ LÝ KHI CÓ ISSUE MỚI HOẶC CẬP NHẬT ISSUE
            if (eventName === 'issues') {
              const issueTitle = context.payload.issue.title || "";
              const issueBody = context.payload.issue.body || "";
              const issueNumber = context.issue.number;
              const fullContent = `${issueTitle} ${issueBody}`.toLowerCase();
              
              // Gửi bình luận chào mừng nếu đây là hành động tạo mới (opened)
              if (context.payload.action === 'opened') {
                const welcomeMessage = `Cảm ơn bạn đã báo cáo vấn đề. Nếu như đó là vấn đề sửa, vui lòng ghi \`fix:...\`, còn không thì ghi \`chore:\`.
                
                Nếu bạn biết cách sửa, hoan nghênh các đóng góp. Bạn có thể đóng góp tại yêu cầu kéo này: https://github.com/dangdinhbaohoang12/quan-ly-gian/pulls`;
                
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: welcomeMessage
                });
              }
              
              // Kiểm tra từ khóa để xác định nhãn cần dán
              let labelToAdd = "";
              if (fullContent.includes('fix:') || fullContent.includes('fix ')) {
                labelToAdd = "high priority";
              } else if (fullContent.includes('chore:') || fullContent.includes('chore ')) {
                labelToAdd = "low priority";
              }
              
              // Tiến hành dán nhãn nếu tìm thấy từ khóa thích hợp
              if (labelToAdd) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: [labelToAdd]
                });
              }
            }
            
            // 2. XỬ LÝ KHI CÓ PULL REQUEST MỚI
            if (eventName === 'pull_request') {
              const prNumber = context.payload.pull_request.number;
              
              // Gửi bình luận thông báo vào Pull Request
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `đây chỉ là nhãn dán để tránh Ai cubic bình luận quá nhiều, code không hề có vấn đề gì cả. nó sẽ được hạ xuống.`
              });
              
              // Tự động dán nhãn skip-review
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ['skip-review']
              });
            }
