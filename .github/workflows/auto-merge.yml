name: Auto Squash PR

on:
  pull_request:
    types: [labeled, opened, edited, synchronize, reopened]
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: write
  contents: write
  issues: write

jobs:
  # JOB 1: KÍCH HOẠT AUTO-SQUASH (Chạy khi PR sạch, pass review và có nhãn "tự động hợp nhất")
  enable-auto-squash:
    runs-on: ubuntu-latest
    # Chỉ chạy khi PR có nhãn "tự động hợp nhất"
    if: contains(github.event.pull_request.labels.*.name, 'tự động hợp nhất')
    steps:
      - name: Enable Auto-Merge (Squash)
        uses: alexwilson/enable-github-automerge-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-method: SQUASH # Thay đổi thành SQUASH theo yêu cầu của bạn

  # JOB 2: XỬ LÝ KHI CÓ REVIEWER CAN THIỆP (Bình luận / Yêu cầu sửa) -> Đổi nhãn lỗi
  handle-reviewer-intervention:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request_review' &&
      (github.event.review.state == 'commented' || github.event.review.state == 'changes_requested')
    steps:
      - name: Update Labels (Remove Auto, Add Error Label)
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const labels = context.payload.pull_request.labels.map(l => l.name);
            
            // Nếu đang có nhãn tự động hợp nhất thì gỡ ra
            if (labels.includes('tự động hợp nhất')) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: prNumber, name: 'tự động hợp nhất'
              });
            }
            
            // Thêm nhãn không đủ điều kiện hợp nhất
            if (!labels.includes('không đủ điều kiện hợp nhất')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: prNumber, labels: ['không đủ điều kiện hợp nhất']
              });
            }

      - name: Comment Warning
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '⚠️ **Không thể hợp nhất khi có reviewer bình luận hoặc yêu cầu chỉnh sửa.** Đã chuyển trạng thái sang "không đủ điều kiện hợp nhất".'
            });

  # JOB 3: TỰ ĐỘNG KHÔI PHỤC (Chạy khi push sửa code / giải quyết xung đột xong)
  check-and-recover:
    runs-on: ubuntu-latest
    # Chạy khi PR được cập nhật (synchronize) hoặc được review lại
    if: github.event_name == 'pull_request' || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved')
    steps:
      - name: Check PR Status (Conflicts & Reviews)
        id: pr_check
        uses: actions/github-script@v7
        with:
          script: |
            // Đợi một chút để GitHub cập nhật trạng thái mergeable sau khi push
            await new Promise(r => setTimeout(r, 5000)); 
            
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner, repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            
            // Kiểm tra xem có review nào đang chặn (CHANGES_REQUESTED) không
            const isBlocked = reviews.some(r => r.state === 'CHANGES_REQUESTED');
            
            // Trạng thái xung đột: pr.mergeable === false nghĩa là bị xung đột dữ dội
            const hasConflict = pr.mergeable === false;
            
            core.setOutput('can_merge', (!isBlocked && !hasConflict).toString());

      - name: Switch Labels back to Auto Merge
        if: steps.pr_check.outputs.can_merge == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const labels = context.payload.pull_request.labels.map(l => l.name);
            
            // Xóa nhãn báo lỗi cũ nếu có
            if (labels.includes('không đủ điều kiện hợp nhất')) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: prNumber, name: 'không đủ điều kiện hợp nhất'
              });
            }
            
            // Tự động thêm lại nhãn hợp nhất
            if (!labels.includes('tự động hợp nhất')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: prNumber, labels: ['tự động hợp nhất']
              });
            }
