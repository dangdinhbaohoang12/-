name: PR Final Gate - Auto Merge

# This workflow is intentionally standalone.
# It never checks out or executes PR code.
# It only reads GitHub metadata/checks/reviews and performs PR/label/auto-merge operations.

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled

  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed

  pull_request_review_comment:
    types:
      - created
      - edited
      - deleted

  issue_comment:
    types:
      - created
      - edited
      - deleted

  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to evaluate
        required: true
        type: number

permissions:
  actions: read
  checks: read
  statuses: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pr-final-gate-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || 'unknown' }}
  # Final Gate waits for CI and mutates PR state; queued events must not cancel an active evaluation.
  cancel-in-progress: false

jobs:
  final-gate:
    name: Final PR gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Evaluate CI, reviews, label, conflicts, and auto-merge
        uses: actions/github-script@v9
        env:
          READY_LABEL: "sẵn sàng hợp nhất"
          MERGE_METHOD: "SQUASH"
          MAX_CI_WAIT_SECONDS: "900"
          POLL_INTERVAL_SECONDS: "20"

          # These names are taken from .github/workflows/ci.yml.
          REQUIRED_WORKFLOW_NAME: "CI - Build & Test (Offshore PTW)"
          REQUIRED_CHECK_NAME: "Typecheck / Test / Build"

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          script: |
            const sleep = (ms) =>
              new Promise(resolve => setTimeout(resolve, ms));

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const readyLabel = process.env.READY_LABEL;
            const mergeMethod = process.env.MERGE_METHOD || "SQUASH";

            const maxCiWaitSeconds = Number(
              process.env.MAX_CI_WAIT_SECONDS || "900"
            );

            const pollIntervalSeconds = Number(
              process.env.POLL_INTERVAL_SECONDS || "20"
            );

            const requiredWorkflowName =
              process.env.REQUIRED_WORKFLOW_NAME;

            const requiredCheckName =
              process.env.REQUIRED_CHECK_NAME;

            const successfulConclusions = new Set([
              "success"
            ]);

            const blockingConclusions = new Set([
              "failure",
              "cancelled",
              "timed_out",
              "action_required",
              "stale",
              "startup_failure"
            ]);

            function isBotUser(user) {
              return (
                user?.type === "Bot" ||
                /\[bot\]$/i.test(user?.login || "")
              );
            }

            function isRelevantHuman(user, prAuthorLogin) {
              return (
                !!user?.login &&
                user.login !== prAuthorLogin &&
                !isBotUser(user)
              );
            }

            function normalizePath(rawPath) {
              if (!rawPath) return null;

              let path = rawPath
                .trim()
                .replace(/\\/g, "/");

              path = path.replace(
                /^https?:\/\/[^/]+\//,
                ""
              );

              path = path.replace(
                /^.*?\/(?:_?work\/[^/]+\/[^/]+\/)/,
                ""
              );

              path = path.replace(/^\.\/+/, "");

              return path || null;
            }

            function redactSecrets(text) {
              return String(text || "")
                .replace(
                  /gh[pousr]_[A-Za-z0-9_-]{20,}/g,
                  "[REDACTED_TOKEN]"
                )
                .replace(
                  /github_pat_[A-Za-z0-9_-]{20,}/g,
                  "[REDACTED_TOKEN]"
                )
                .replace(
                  /xox[baprs]-[A-Za-z0-9-]{20,}/g,
                  "[REDACTED_SECRET]"
                )
                .replace(
                  /AKIA[0-9A-Z]{16}/g,
                  "[REDACTED_AWS_KEY]"
                );
            }

            function extractErrorDetails(logText) {
              const text = redactSecrets(logText);
              const lines = text.split(/\r?\n/);

              const errorKeywords =
                /(##\[error\]|\berror\b|\bfailed\b|\bfail(?:ed|ure)?\b|exception|assertionerror|test files|typeerror|syntaxerror)/i;

              const interestingIndexes = [];

              for (let i = 0; i < lines.length; i++) {
                if (errorKeywords.test(lines[i])) {
                  interestingIndexes.push(i);
                }
              }

              const snippets = interestingIndexes
                .slice(-12)
                .map(index => {
                  const start = Math.max(0, index - 2);
                  const end = Math.min(
                    lines.length,
                    index + 3
                  );

                  return lines
                    .slice(start, end)
                    .join("\n")
                    .trim();
                })
                .filter(Boolean);

              const fileHits = [];

              const patterns = [
                /(?:^|[\s(])((?:[A-Za-z0-9_.@-]+\/)*[A-Za-z0-9_.@-]+\.(?:ts|tsx|js|jsx|mjs|cjs|java|kt|kts|py|go|rs|cs|cpp|c|h|hpp|swift|rb|php|vue|svelte|css|scss|yml|yaml|json|xml))(?:\(|:)(\d+)(?:(?:,|:)(\d+))?/g,

                /\b((?:src|test|tests|app|core|lib|packages?)\/[A-Za-z0-9_./@-]+\.[A-Za-z0-9]+)\((\d+),(\d+)\)/g
              ];

              for (const line of lines) {
                if (!errorKeywords.test(line)) {
                  continue;
                }

                for (const pattern of patterns) {
                  pattern.lastIndex = 0;

                  let match;

                  while (
                    (match = pattern.exec(line)) !== null
                  ) {
                    const path = normalizePath(match[1]);
                    const lineNumber = Number(match[2]);
                    const column = match[3]
                      ? Number(match[3])
                      : null;

                    if (
                      path &&
                      Number.isInteger(lineNumber)
                    ) {
                      fileHits.push({
                        path,
                        line: lineNumber,
                        column
                      });
                    }
                  }
                }
              }

              const uniqueHits = [];
              const seen = new Set();

              for (const hit of fileHits) {
                const key =
                  `${hit.path}:${hit.line}:${hit.column ?? ""}`;

                if (!seen.has(key)) {
                  seen.add(key);
                  uniqueHits.push(hit);
                }

                if (uniqueHits.length >= 12) {
                  break;
                }
              }

              return {
                snippets: [
                  ...new Set(snippets)
                ].slice(-8),

                fileHits: uniqueHits
              };
            }

            function getPullRequestNumber() {
              if (
                context.eventName === "pull_request_target" ||
                context.eventName === "pull_request_review" ||
                context.eventName === "pull_request_review_comment"
              ) {
                return (
                  context.payload.pull_request?.number ||
                  null
                );
              }

              if (context.eventName === "issue_comment") {
                return context.payload.issue?.pull_request
                  ? context.payload.issue.number
                  : null;
              }

              if (context.eventName === "workflow_dispatch") {
                const value =
                  context.payload.inputs?.pr_number ||
                  core.getInput("pr_number");

                const number = Number(value);

                return Number.isInteger(number) &&
                  number > 0
                  ? number
                  : null;
              }

              return null;
            }

            async function getPullRequest(prNumber) {
              const response =
                await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: prNumber
                });

              return response.data;
            }

            async function getPullRequestGraphQL(prNumber) {
              const data =
                await github.graphql(
                  `
                    query(
                      $owner: String!
                      $repo: String!
                      $number: Int!
                    ) {
                      repository(
                        owner: $owner
                        name: $repo
                      ) {
                        pullRequest(number: $number) {
                          id
                          number
                          isDraft
                          mergeable
                          mergeStateStatus
                          autoMergeRequest {
                            enabledAt
                            mergeMethod
                          }
                        }
                      }
                    }
                  `,
                  {
                    owner,
                    repo,
                    number: prNumber
                  }
                );

              return data.repository.pullRequest;
            }

            async function waitForMergeableState(prNumber) {
              const deadline =
                Date.now() +
                Math.min(
                  maxCiWaitSeconds,
                  120
                ) *
                  1000;

              while (Date.now() < deadline) {
                const pr =
                  await getPullRequestGraphQL(
                    prNumber
                  );

                if (pr.mergeable !== "UNKNOWN") {
                  return pr;
                }

                core.info(
                  "GitHub chưa xác định trạng thái mergeable. Đang chờ..."
                );

                await sleep(5000);
              }

              throw new Error(
                "GitHub vẫn trả về mergeable=UNKNOWN sau thời gian chờ."
              );
            }

            async function getWorkflowRunsForSha(
              headSha
            ) {
              return github.paginate(
                github.rest.actions
                  .listWorkflowRunsForRepo,
                {
                  owner,
                  repo,
                  head_sha: headSha,
                  per_page: 100
                }
              );
            }

            async function getCheckRunsForSha(
              headSha
            ) {
              return github.paginate(
                github.rest.checks.listForRef,
                {
                  owner,
                  repo,
                  ref: headSha,
                  per_page: 100
                }
              );
            }

            async function getCombinedStatuses(
              headSha
            ) {
              const response =
                await github.rest.repos
                  .getCombinedStatusForRef({
                    owner,
                    repo,
                    ref: headSha
                  });

              return response.data;
            }

            function getLatestByTimestamp(
              current,
              candidate
            ) {
              if (!current) {
                return candidate;
              }

              const currentDate = new Date(
                current.submitted_at || 0
              );

              const candidateDate = new Date(
                candidate.submitted_at || 0
              );

              return candidateDate > currentDate
                ? candidate
                : current;
            }

            async function waitForAllCIToSettle(
              headSha
            ) {
              const deadline =
                Date.now() +
                maxCiWaitSeconds * 1000;

              while (Date.now() < deadline) {
                const [
                  workflowRuns,
                  checkRuns,
                  combinedStatus
                ] = await Promise.all([
                  getWorkflowRunsForSha(headSha),
                  getCheckRunsForSha(headSha),
                  getCombinedStatuses(headSha)
                ]);

                /*
                 * Never let this gate count itself as CI.
                 * IMPORTANT:
                 * check.external_id is a job UUID and is not
                 * the workflow run ID.
                 */
                const relevantCheckRuns =
                  checkRuns.filter(
                    check =>
                      check.name !==
                      "Final PR gate"
                  );

                /*
                 * These are the repository's actual CI workflow
                 * and job names from .github/workflows/ci.yml.
                 */
                /*
                 * Only the repository CI triggered by pull_request is
                 * authoritative for a PR. A push-triggered run on the
                 * same SHA must not be counted as PR CI evidence.
                 */
                const relevantWorkflowRuns =
                  workflowRuns.filter(
                    run =>
                      run.name === requiredWorkflowName &&
                      run.event === "pull_request"
                  );

                const requiredCheckSuiteIds =
                  new Set(
                    relevantWorkflowRuns
                      .map(run => run.check_suite_id)
                      .filter(Boolean)
                  );

                /*
                 * Only accept the required check from a check suite
                 * belonging to the authoritative pull_request workflow.
                 */
                const relevantCiCheckRuns =
                  relevantCheckRuns.filter(
                    check =>
                      check.name === requiredCheckName &&
                      requiredCheckSuiteIds.has(
                        check.check_suite?.id
                      )
                  );

                const sawRequiredWorkflow =
                  relevantWorkflowRuns.length > 0;

                const sawRequiredCheck =
                  relevantCiCheckRuns.length > 0;

                const allRequiredEvidenceExists =
                  sawRequiredWorkflow &&
                  sawRequiredCheck;

                const pendingWorkflows =
                  relevantWorkflowRuns.filter(
                    run => run.status !== "completed"
                  );

                const pendingChecks =
                  relevantCiCheckRuns.filter(
                    check =>
                      check.status !== "completed"
                  );

                const failedWorkflows =
                  relevantWorkflowRuns.filter(
                    run =>
                      run.status === "completed" &&
                      blockingConclusions.has(
                        String(
                          run.conclusion || ""
                        ).toLowerCase()
                      )
                  );

                const failedChecks =
                  relevantCiCheckRuns.filter(
                    check =>
                      check.status === "completed" &&
                      blockingConclusions.has(
                        String(
                          check.conclusion || ""
                        ).toLowerCase()
                      )
                  );

                const unsuccessfulCompletedWorkflows =
                  relevantWorkflowRuns.filter(
                    run => {
                      if (
                        run.status !==
                        "completed"
                      ) {
                        return false;
                      }

                      return !successfulConclusions.has(
                        String(
                          run.conclusion || ""
                        ).toLowerCase()
                      );
                    }
                  );

                const unsuccessfulCompletedChecks =
                  relevantCiCheckRuns.filter(
                    check => {
                      if (
                        check.status !==
                        "completed"
                      ) {
                        return false;
                      }

                      return !successfulConclusions.has(
                        String(
                          check.conclusion || ""
                        ).toLowerCase()
                      );
                    }
                  );

                const pendingStatuses =
                  (
                    combinedStatus.statuses ||
                    []
                  ).filter(
                    status =>
                      status.state ===
                      "pending"
                  );

                const failedStatuses =
                  (
                    combinedStatus.statuses ||
                    []
                  ).filter(
                    status =>
                      [
                        "failure",
                        "error"
                      ].includes(
                        status.state
                      )
                  );

                core.info(
                  [
                    `CI ${headSha}`,
                    `workflow=${relevantWorkflowRuns.length}`,
                    `check=${relevantCiCheckRuns.length}`,
                    `pendingWorkflow=${pendingWorkflows.length}`,
                    `pendingCheck=${pendingChecks.length}`,
                    `pendingStatus=${pendingStatuses.length}`,
                    `failedWorkflow=${failedWorkflows.length}`,
                    `failedCheck=${failedChecks.length}`,
                    `failedStatus=${failedStatuses.length}`
                  ].join(" ")
                );

                if (
                  failedWorkflows.length > 0 ||
                  failedChecks.length > 0 ||
                  failedStatuses.length > 0
                ) {
                  const workflowNames =
                    failedWorkflows
                      .map(
                        run =>
                          `${run.name} (${run.conclusion})`
                      )
                      .join(", ");

                  const checkNames =
                    failedChecks
                      .map(
                        check =>
                          `${check.name} (${check.conclusion})`
                      )
                      .join(", ");

                  const statusNames =
                    failedStatuses
                      .map(
                        status =>
                          `${status.context} (${status.state})`
                      )
                      .join(", ");

                  const details = [
                    workflowNames,
                    checkNames,
                    statusNames
                  ]
                    .filter(Boolean)
                    .join(", ");

                  throw new Error(
                    `CI thất bại: ${details}`
                  );
                }

                /*
                 * Do NOT treat an empty result as success.
                 * We require both the expected workflow and
                 * expected CI job check to have appeared.
                 */
                if (
                  allRequiredEvidenceExists &&
                  pendingWorkflows.length === 0 &&
                  pendingChecks.length === 0 &&
                  pendingStatuses.length === 0 &&
                  unsuccessfulCompletedWorkflows.length === 0 &&
                  unsuccessfulCompletedChecks.length === 0
                ) {
                  core.info(
                    "Tất cả CI bắt buộc cho HEAD hiện tại đã hoàn thành thành công."
                  );

                  return {
                    workflowRuns:
                      relevantWorkflowRuns,
                    checkRuns:
                      relevantCiCheckRuns,
                    combinedStatus,
                    requiredCiComplete: true,
                  };
                }

                const missing = [];

                if (!sawRequiredWorkflow) {
                  missing.push(
                    `workflow:${requiredWorkflowName}`
                  );
                }

                if (!sawRequiredCheck) {
                  missing.push(
                    `check:${requiredCheckName}`
                  );
                }

                if (missing.length > 0) {
                  core.info(
                    `Đang chờ CI đăng ký: ${missing.join(", ")}`
                  );
                } else {
                  core.info(
                    `Đang chờ CI hoàn thành: ${pendingWorkflows.length + pendingChecks.length + pendingStatuses.length} mục.`
                  );
                }

                await sleep(
                  pollIntervalSeconds * 1000
                );
              }

              throw new Error(
                `CI không hoàn thành trong ${maxCiWaitSeconds} giây.`
              );
            }

            async function getReviewThreads(
              prNumber
            ) {
              const threads = [];
              let after = null;

              do {
                const data =
                  await github.graphql(
                    `
                      query(
                        $owner: String!
                        $repo: String!
                        $number: Int!
                        $after: String
                      ) {
                        repository(
                          owner: $owner
                          name: $repo
                        ) {
                          pullRequest(
                            number: $number
                          ) {
                            reviewThreads(
                              first: 100
                              after: $after
                            ) {
                              nodes {
                                isResolved
                                comments(first: 1) {
                                  nodes {
                                    author {
                                      login
                                      __typename
                                    }
                                    body
                                    path
                                    line
                                    url
                                  }
                                }
                              }
                              pageInfo {
                                hasNextPage
                                endCursor
                              }
                            }
                          }
                        }
                      }
                    `,
                    {
                      owner,
                      repo,
                      number: prNumber,
                      after
                    }
                  );

                const connection =
                  data.repository.pullRequest
                    .reviewThreads;

                threads.push(
                  ...(connection.nodes || [])
                );

                after =
                  connection.pageInfo.hasNextPage
                    ? connection.pageInfo.endCursor
                    : null;
              } while (after);

              return threads;
            }

            async function getReviews(
              prNumber
            ) {
              return github.paginate(
                github.rest.pulls.listReviews,
                {
                  owner,
                  repo,
                  pull_number: prNumber,
                  per_page: 100
                }
              );
            }

            async function evaluateReviews(
              prNumber,
              prAuthorLogin
            ) {
              const reviews =
                await getReviews(prNumber);

              const humanReviews =
                reviews.filter(review =>
                  isRelevantHuman(
                    review.user,
                    prAuthorLogin
                  )
                );

              /*
               * Latest review of any state.
               * This is used to enforce the user's rule:
               * if there is a review, it must not be merely
               * a COMMENTED review.
               */
              const latestAnyByReviewer =
                new Map();

              /*
               * IMPORTANT:
               * COMMENTED must NOT hide an older active
               * CHANGES_REQUESTED review.
               *
               * Therefore we keep a second map containing
               * only decisive states.
               */
              const latestDecisiveByReviewer =
                new Map();

              const decisiveStates = new Set([
                "APPROVED",
                "CHANGES_REQUESTED",
                "DISMISSED"
              ]);

              for (const review of humanReviews) {
                if (!review.submitted_at) {
                  continue;
                }

                const login =
                  review.user.login;

                latestAnyByReviewer.set(
                  login,
                  getLatestByTimestamp(
                    latestAnyByReviewer.get(login),
                    review
                  )
                );

                const state =
                  String(
                    review.state || ""
                  ).toUpperCase();

                if (
                  decisiveStates.has(state)
                ) {
                  latestDecisiveByReviewer.set(
                    login,
                    getLatestByTimestamp(
                      latestDecisiveByReviewer.get(
                        login
                      ),
                      review
                    )
                  );
                }
              }

              const blockingLatestDecisiveReviews =
                [
                  ...latestDecisiveByReviewer.values()
                ].filter(
                  review =>
                    String(
                      review.state || ""
                    ).toUpperCase() ===
                    "CHANGES_REQUESTED"
                );

              const blockingCommentedReviews =
                [
                  ...latestAnyByReviewer.values()
                ].filter(
                  review =>
                    String(
                      review.state || ""
                    ).toUpperCase() ===
                    "COMMENTED"
                );

              const threads =
                await getReviewThreads(prNumber);

              const unresolvedHumanThreads =
                threads.filter(thread => {
                  if (thread.isResolved) {
                    return false;
                  }

                  const firstComment =
                    thread.comments
                      ?.nodes?.[0];

                  return isRelevantHuman(
                    firstComment?.author,
                    prAuthorLogin
                  );
                });

              return {
                reviews,
                humanReviews,
                latestAnyByReviewer,
                latestDecisiveByReviewer,
                blockingLatestDecisiveReviews,
                blockingCommentedReviews,
                unresolvedHumanThreads
              };
            }

            async function disableAutoMerge(
              prNodeId,
              enabled,
              reason
            ) {
              if (!enabled) {
                return;
              }

              try {
                await github.graphql(
                  `
                    mutation(
                      $pullRequestId: ID!
                    ) {
                      disablePullRequestAutoMerge(
                        input: {
                          pullRequestId:
                            $pullRequestId
                        }
                      ) {
                        pullRequest {
                          id
                        }
                      }
                    }
                  `,
                  {
                    pullRequestId: prNodeId
                  }
                );

                core.notice(
                  `Auto-Merge đã được tắt${reason ? `: ${reason}` : ""}.`
                );
              } catch (error) {
                /*
                 * If auto-merge is still enabled and we cannot
                 * disable it, fail closed rather than silently
                 * pretending the PR is safe.
                 */
                throw new Error(
                  `Không thể tắt Auto-Merge${reason ? ` (${reason})` : ""}: ${error.message || error}`
                );
              }
            }

            async function enableAutoMerge(
              prNodeId,
              headSha,
              prNumber
            ) {
              try {
                const result =
                  await github.graphql(
                    `
                      mutation(
                        $pullRequestId: ID!
                        $expectedHeadOid: GitObjectID!
                        $mergeMethod: PullRequestMergeMethod!
                      ) {
                        enablePullRequestAutoMerge(
                          input: {
                            pullRequestId: $pullRequestId
                            expectedHeadOid: $expectedHeadOid
                            mergeMethod: $mergeMethod
                          }
                        ) {
                          pullRequest {
                            autoMergeRequest {
                              enabledAt
                              mergeMethod
                            }
                          }
                        }
                      }
                    `,
                    {
                      pullRequestId: prNodeId,
                      expectedHeadOid: headSha,
                      mergeMethod
                    }
                  );

                const autoMerge =
                  result
                    .enablePullRequestAutoMerge
                    ?.pullRequest
                    ?.autoMergeRequest;

                if (!autoMerge) {
                  throw new Error(
                    "GitHub không trả về autoMergeRequest."
                  );
                }

                core.notice(
                  `Auto-Merge đã được bật cho PR #${prNumber} bằng ${autoMerge.mergeMethod}.`
                );
              } catch (error) {
                const message =
                  error?.message || String(error);

                const isCleanStatusRejection =
                  /clean status/i.test(message);
                const isIntegrationPermissionRejection =
                  /Resource not accessible by integration/i.test(message);

                if (
                  isCleanStatusRejection ||
                  isIntegrationPermissionRejection
                ) {
                  const latestPrGraph =
                    await getPullRequestGraphQL(prNumber);

                  if (
                    latestPrGraph.mergeStateStatus === "CLEAN" ||
                    isCleanStatusRejection
                  ) {
                    const mergeResponse =
                      await github.rest.pulls.merge({
                        owner,
                        repo,
                        pull_number: prNumber,
                        sha: headSha,
                        merge_method: mergeMethod.toLowerCase()
                      });

                    if (!mergeResponse.data.merged) {
                      throw new Error(
                        `GitHub không thể merge PR #${prNumber}: ${mergeResponse.data.message || "unknown error"}`
                      );
                    }

                    core.notice(
                      `PR #${prNumber} đã được merge trực tiếp bằng ${mergeMethod} cho SHA ${headSha} vì trạng thái đã CLEAN.`
                    );
                    return;
                  }
                }

                throw new Error(
                  `Không thể bật Auto-Merge cho PR #${prNumber}: ${message}`
                );
              }
            }

            
            async function addCommentOnce(
              prNumber,
              marker,
              body
            ) {
              const comments =
                await github.paginate(
                  github.rest.issues.listComments,
                  {
                    owner,
                    repo,
                    issue_number: prNumber,
                    per_page: 100
                  }
                );

              const exists =
                comments.some(
                  comment =>
                    typeof comment.body ===
                      "string" &&
                    comment.body.includes(
                      marker
                    )
                );

              if (!exists) {
                await github.rest.issues.createComment(
                  {
                    owner,
                    repo,
                    issue_number: prNumber,
                    body
                  }
                );
              }
            }

            async function fetchJobLog(jobId) {
              const response =
                await fetch(
                  `https://api.github.com/repos/${owner}/${repo}/actions/jobs/${jobId}/logs`,
                  {
                    headers: {
                      Authorization:
                        `Bearer ${process.env.GITHUB_TOKEN}`,
                      Accept:
                        "application/vnd.github+json",
                      "X-GitHub-Api-Version":
                        "2026-03-10"
                    },
                    redirect: "follow"
                  }
                );

              if (!response.ok) {
                throw new Error(
                  `HTTP ${response.status} while downloading job log ${jobId}`
                );
              }

              return response.text();
            }

            async function collectFailureReports(
              failedWorkflowRuns,
              failedCheckRuns
            ) {
              const reports = [];

              for (
                const run of
                failedWorkflowRuns.slice(0, 8)
              ) {
                let jobs = [];

                try {
                  jobs =
                    await github.paginate(
                      github.rest.actions
                        .listJobsForWorkflowRun,
                      {
                        owner,
                        repo,
                        run_id: run.id,
                        per_page: 100
                      }
                    );
                } catch (error) {
                  reports.push({
                    title: run.name,
                    url: run.html_url,
                    text:
                      `Không thể lấy danh sách job: ${error.message || error}`,
                    fileHits: []
                  });

                  continue;
                }

                const failedJobs =
                  jobs.filter(job => {
                    const conclusion =
                      String(
                        job.conclusion ||
                          ""
                      ).toLowerCase();

                    return (
                      job.status ===
                        "completed" &&
                      !successfulConclusions.has(
                        conclusion
                      )
                    );
                  });

                for (
                  const job of
                  failedJobs.slice(0, 6)
                ) {
                  let logText = "";

                  try {
                    logText =
                      await fetchJobLog(
                        job.id
                      );
                  } catch (error) {
                    logText =
                      `Không thể tải log job: ${error.message || error}`;
                  }

                  const details =
                    extractErrorDetails(
                      logText
                    );

                  reports.push({
                    title:
                      `${run.name} / ${job.name}`,
                    url:
                      job.html_url ||
                      run.html_url,
                    text:
                      details.snippets
                        .join("\n---\n")
                        .slice(-7000) ||
                      "Không tìm thấy dòng lỗi rõ ràng trong log.",
                    fileHits:
                      details.fileHits
                  });
                }
              }

              for (
                const check of
                failedCheckRuns.slice(0, 8)
              ) {
                reports.push({
                  title: check.name,
                  url:
                    check.details_url ||
                    check.html_url,
                  text:
                    `CI check kết thúc với trạng thái: ${check.conclusion || check.status}`,
                  fileHits: []
                });
              }

              return reports;
            }

            async function requestChangesForCiFailure(
              prNumber,
              headSha,
              reports
            ) {
              const fileLines = [];
              const seen = new Set();

              for (const report of reports) {
                for (const hit of report.fileHits) {
                  const key =
                    `${hit.path}:${hit.line}`;

                  if (!seen.has(key)) {
                    seen.add(key);

                    fileLines.push(
                      `${hit.path}:${hit.line}${
                        hit.column
                          ? `:${hit.column}`
                          : ""
                      }`
                    );
                  }

                  if (
                    fileLines.length >= 20
                  ) {
                    break;
                  }
                }

                if (
                  fileLines.length >= 20
                ) {
                  break;
                }
              }

              const reportSections =
                reports
                  .map(report =>
                    [
                      `### ${report.title}`,
                      report.url
                        ? `[Mở log/check](${report.url})`
                        : "",
                      "```text",
                      report.text.slice(
                        -7000
                      ),
                      "```"
                    ]
                      .filter(Boolean)
                      .join("\n")
                  )
                  .join("\n\n");

              const body = [
                "Vui lòng sửa hết lỗi trước khi hợp nhất.",
                "",
                "Workflow Final Gate đã phát hiện CI/test thất bại.",
                fileLines.length
                  ? [
                      "Các file/dòng lỗi được tìm thấy:",
                      fileLines
                        .map(
                          item =>
                            `- \`${item}\``
                        )
                        .join("\n")
                    ].join("\n")
                  : "Log chưa cung cấp được file:dòng lỗi rõ ràng.",
                "",
                reportSections.slice(
                  0,
                  20000
                )
              ].join("\n");

              const existingReviews =
                await github.paginate(
                  github.rest.pulls.listReviews,
                  {
                    owner,
                    repo,
                    pull_number: prNumber,
                    per_page: 100
                  }
                );

              const existingBotChangesRequest =
                existingReviews.find(
                  review =>
                    review.user?.login === "github-actions[bot]" &&
                    review.commit_id === headSha &&
                    String(review.state || "").toUpperCase() ===
                      "CHANGES_REQUESTED"
                );

              if (!existingBotChangesRequest) {
                await github.rest.pulls.createReview(
                  {
                    owner,
                    repo,
                    pull_number: prNumber,
                    event: "REQUEST_CHANGES",
                    body,
                    commit_id: headSha
                  }
                );
              } else {
                core.info(
                  "Đã có review REQUEST_CHANGES của github-actions[bot] cho " +
                    headSha +
                    "; không tạo review trùng."
                );
              }


              const marker =
                `<!-- pr-final-gate:ci-failure:${headSha} -->`;

              await addCommentOnce(
                prNumber,
                marker,
                `${marker}\n${body}`.slice(
                  0,
                  60000
                )
              );
            }

            async function approveIfNeeded(
              prNumber,
              headSha,
              reviews
            ) {
              /*
               * Preserve the existing behavior: the workflow may
               * record its technical approval after all gates pass.
               */
              const existingReviews =
                await github.paginate(
                  github.rest.pulls.listReviews,
                  {
                    owner,
                    repo,
                    pull_number: prNumber,
                    per_page: 100
                  }
                );

              const botChangesRequests =
                existingReviews.filter(
                  review =>
                    review.user?.login === "github-actions[bot]" &&
                    review.commit_id === headSha &&
                    String(review.state || "").toUpperCase() ===
                      "CHANGES_REQUESTED"
                );

              for (const review of botChangesRequests) {
                await github.rest.pulls.dismissReview({
                  owner,
                  repo,
                  pull_number: prNumber,
                  review_id: review.id,
                  message:
                    "CI đã chạy lại thành công cho cùng HEAD; gỡ review REQUEST_CHANGES tự động trước khi APPROVE."
                });
              }


              const existingApproval =
                reviews.find(
                  review =>
                    review.user?.login === "github-actions[bot]" &&
                    String(review.state || "").toUpperCase() ===
                      "APPROVED" &&
                    review.commit_id === headSha
                );

              if (existingApproval) {
                return;
              }

              await github.rest.pulls.createReview(
                {
                  owner,
                  repo,
                  pull_number: prNumber,
                  event: "APPROVE",
                  body:
                    "Technical gate passed: CI, labels, reviews and mergeability checks passed.",
                  commit_id: headSha
                }
              );
            }

            
            async function main() {
              const prNumber =
                getPullRequestNumber();

              if (!prNumber) {
                core.notice(
                  "Không tìm thấy PR hợp lệ. Bỏ qua."
                );
                return;
              }

              core.info(
                `Đang phân tích PR #${prNumber}...`
              );

              let pr =
                await getPullRequest(
                  prNumber
                );

              if (!pr) {
                throw new Error(
                  `Không tìm thấy PR #${prNumber}.`
                );
              }

              if (pr.state !== "open") {
                core.notice(
                  `PR #${prNumber} không còn mở.`
                );
                return;
              }

              const prAuthorLogin =
                pr.user?.login || "";

              const currentHeadSha =
                pr.head.sha;

              if (!currentHeadSha) {
                throw new Error(
                  "Không lấy được HEAD SHA của PR."
                );
              }

              let prGraph =
                await getPullRequestGraphQL(
                  prNumber
                );

              const labels = new Set(
                (pr.labels || []).map(
                  label => label.name
                )
              );

              let hasReadyLabel =
                labels.has(readyLabel);

              /*
               * The ready label is an explicit opt-in.
               * Only an admin may add it. Always inspect the latest
               * matching labeled event, regardless of context.eventName.
               */
              if (hasReadyLabel) {
                try {
                  const labelEvents =
                    await github.paginate(
                      github.rest.issues.listEvents,
                      {
                        owner,
                        repo,
                        issue_number: prNumber,
                        per_page: 100
                      }
                    );

                  const latestReadyLabelEvent =
                    labelEvents
                      .filter(
                        event =>
                          event.event === "labeled" &&
                          event.label?.name === readyLabel
                      )
                      .sort(
                        (a, b) =>
                          new Date(a.created_at || 0).getTime() -
                          new Date(b.created_at || 0).getTime()
                      )
                      .at(-1);

                  const labelActor =
                    latestReadyLabelEvent?.actor?.login;

                  if (!labelActor) {
                    throw new Error(
                      "Không tìm thấy actor của lần thêm label gần nhất."
                    );
                  }

                  const permission =
                    await github.rest.repos
                      .getCollaboratorPermissionLevel({
                        owner,
                        repo,
                        username: labelActor
                      });

                  if (permission.data.permission !== "admin") {
                    await github.rest.issues.removeLabel({
                      owner,
                      repo,
                      issue_number: prNumber,
                      name: readyLabel
                    });

                    await addCommentOnce(
                      prNumber,
                      `<!-- pr-final-gate:unauthorized-label:${currentHeadSha} -->`,
                      [
                        `<!-- pr-final-gate:unauthorized-label:${currentHeadSha} -->`,
                        `Nhãn \`${readyLabel}\` chỉ được phép bởi người có quyền quản trị.`,
                        `Actor thêm label gần nhất: @${labelActor}.`,
                        "Nhãn đã được tự động gỡ."
                      ].join("\n")
                    );

                    hasReadyLabel = false;
                    return;
                  }

                  core.info(
                    `Label "${readyLabel}" được thêm gần nhất bởi admin @${labelActor}.`
                  );
                } catch (error) {
                  core.warning(
                    `Không thể xác minh người thêm label: ${error.message || error}`
                  );

                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: prNumber,
                    name: readyLabel
                  });

                  return;
                }
              }

              /*
               * If the label has been removed after a previous
               * run enabled auto-merge, explicitly turn it off.
               */
              if (!hasReadyLabel) {
                await disableAutoMerge(
                  prGraph.id,
                  !!prGraph.autoMergeRequest,
                  "label sẵn sàng hợp nhất không còn tồn tại"
                );

                core.notice(
                  `PR #${prNumber} chưa có label "${readyLabel}".`
                );

                return;
              }

              /*
               * IMPORTANT:
               * GraphQL PullRequest uses isDraft, not draft.
               */
              if (prGraph.isDraft) {
                await disableAutoMerge(
                  prGraph.id,
                  !!prGraph.autoMergeRequest,
                  "PR vẫn là Draft"
                );

                core.notice(
                  `PR #${prNumber} vẫn đang ở trạng thái Draft.`
                );

                return;
              }

              core.info(
                `Đã tìm thấy label "${readyLabel}".`
              );

              core.info(
                `HEAD SHA hiện tại: ${currentHeadSha}`
              );

              /*
               * 1. CI must be observed and pass.
               * Empty CI results are NOT considered success.
               */
              let ci;

              try {
                ci =
                  await waitForAllCIToSettle(
                    currentHeadSha
                  );
              } catch (error) {
                /*
                 * Refresh before deciding whether an old
                 * auto-merge request must be disabled.
                 */
                prGraph =
                  await getPullRequestGraphQL(
                    prNumber
                  );

                await disableAutoMerge(
                  prGraph.id,
                  !!prGraph.autoMergeRequest,
                  "CI thất bại hoặc chưa hoàn thành"
                );

                /*
                 * Try to collect detailed CI reports.
                 */
                try {
                  const [
                    workflowRuns,
                    checkRuns
                  ] = await Promise.all([
                    getWorkflowRunsForSha(
                      currentHeadSha
                    ),
                    getCheckRunsForSha(
                      currentHeadSha
                    )
                  ]);

                  const failedWorkflowRuns =
                    workflowRuns.filter(
                      run =>
                        run.name === requiredWorkflowName &&
                        run.event === "pull_request" &&
                        run.status === "completed" &&
                        !successfulConclusions.has(
                          String(run.conclusion || "").toLowerCase()
                        )
                    );

                  const failedWorkflowCheckSuiteIds =
                    new Set(
                      workflowRuns
                        .filter(
                          run =>
                            run.name === requiredWorkflowName &&
                            run.event === "pull_request"
                        )
                        .map(run => run.check_suite_id)
                        .filter(Boolean)
                    );

                  const failedRequiredChecks =
                    checkRuns.filter(
                      check =>
                        check.name === requiredCheckName &&
                        failedWorkflowCheckSuiteIds.has(
                          check.check_suite?.id
                        ) &&
                        check.status === "completed" &&
                        !successfulConclusions.has(
                          String(check.conclusion || "").toLowerCase()
                        )
                    );

                  const reports =
                    await collectFailureReports(
                      failedWorkflowRuns,
                      failedRequiredChecks
                    );

                  if (reports.length > 0) {
                    try {
                      await requestChangesForCiFailure(
                        prNumber,
                        currentHeadSha,
                        reports
                      );
                    } catch (reviewError) {
                      core.warning(
                        `Không thể tạo review REQUEST_CHANGES tự động: ${reviewError.message || reviewError}`
                      );
                    }
                  }
                } catch (reportError) {
                  core.warning(
                    `Không thể thu thập báo cáo CI: ${reportError.message || reportError}`
                  );
                }

                throw error;
              }

              /*
               * 2. Re-fetch PR after CI.
               * Never enable Auto-Merge for a stale SHA.
               */
              pr =
                await getPullRequest(
                  prNumber
                );

              if (
                pr.head.sha !==
                currentHeadSha
              ) {
                await disableAutoMerge(
                  prGraph.id,
                  !!prGraph.autoMergeRequest,
                  "HEAD SHA đã thay đổi trong khi chờ CI"
                );

                throw new Error(
                  "HEAD SHA của PR đã thay đổi trong lúc chờ CI. Chạy lại Final Gate cho commit mới."
                );
              }

              /*
               * 3. Re-fetch GraphQL state after CI.
               */
              prGraph =
                await waitForMergeableState(
                  prNumber
                );

              if (prGraph.isDraft) {
                await disableAutoMerge(
                  prGraph.id,
                  !!prGraph.autoMergeRequest,
                  "PR trở lại Draft"
                );

                core.notice(
                  "PR đã trở lại Draft. Không bật Auto-Merge."
                );

                return;
              }

              if (
                prGraph.mergeable ===
                "CONFLICTING"
              ) {
                await disableAutoMerge(
                  prGraph.id,
                  !!prGraph.autoMergeRequest,
                  "PR đang conflict"
                );

                throw new Error(
                  "PR đang bị xung đột (CONFLICTING). Không thể bật Auto-Merge."
                );
              }

              if (
                prGraph.mergeable ===
                "UNKNOWN"
              ) {
                await disableAutoMerge(
                  prGraph.id,
                  !!prGraph.autoMergeRequest,
                  "GitHub chưa xác định trạng thái mergeable"
                );

                throw new Error(
                  "GitHub chưa xác định được trạng thái mergeable."
                );
              }

              /*
               * 4. Review evaluation.
               *
               * Rules:
               * - Historical CHANGES_REQUESTED alone is not permanent.
               * - Latest decisive review determines whether a reviewer
               *   is actively requesting changes.
               * - COMMENTED cannot hide a previous CHANGES_REQUESTED.
               * - COMMENTED itself is not an approval, so it blocks the gate.
               * - Unresolved reviewer threads block the gate.
               */
              const reviewState =
                await evaluateReviews(
                  prNumber,
                  prAuthorLogin
                );

              if (
                reviewState
                  .blockingLatestDecisiveReviews
                  .length > 0
              ) {
                await disableAutoMerge(
                  prGraph.id,
                  !!prGraph.autoMergeRequest,
                  "reviewer có CHANGES_REQUESTED đang còn hiệu lực"
                );

                await github.rest.issues
                  .removeLabel({
                    owner,
                    repo,
                    issue_number: prNumber,
                    name: readyLabel
                  });

                const reviewers = [
                  ...new Set(
                    reviewState
                      .blockingLatestDecisiveReviews
                      .map(
                        review =>
                          review.user.login
                      )
                  )
                ];

                await addCommentOnce(
                  prNumber,
                  `<!-- pr-final-gate:reviewer-block:${currentHeadSha} -->`,
                  [
                    `<!-- pr-final-gate:reviewer-block:${currentHeadSha} -->`,
                    "không thể hợp nhất khi có reviewer",
                    "",
                    `Reviewer yêu cầu thay đổi: ${reviewers.map(name => `@${name}`).join(", ")}`,
                    "",
                    `Nhãn \`${readyLabel}\` đã được gỡ.`,
                    "Sau khi reviewer cập nhật/giải quyết phản hồi, chủ kho lưu trữ cần thêm lại nhãn để kích hoạt lại Final Gate."
                  ].join("\n")
                );

                return;
              }

              if (
                reviewState
                  .blockingCommentedReviews
                  .length > 0
              ) {
                await disableAutoMerge(
                  prGraph.id,
                  !!prGraph.autoMergeRequest,
                  "có reviewer COMMENTED thay vì APPROVED"
                );

                await github.rest.issues
                  .removeLabel({
                    owner,
                    repo,
                    issue_number: prNumber,
                    name: readyLabel
                  });

                const reviewers = [
                  ...new Set(
                    reviewState
                      .blockingCommentedReviews
                      .map(
                        review =>
                          review.user.login
                      )
                  )
                ];

                await addCommentOnce(
                  prNumber,
                  `<!-- pr-final-gate:commented-review:${currentHeadSha} -->`,
                  [
                    `<!-- pr-final-gate:commented-review:${currentHeadSha} -->`,
                    "không thể hợp nhất khi có reviewer",
                    "",
                    `Reviewer chưa APPROVED: ${reviewers.map(name => `@${name}`).join(", ")}`,
                    "",
                    `Nhãn \`${readyLabel}\` đã được gỡ.`
                  ].join("\n")
                );

                return;
              }

              if (
                reviewState
                  .unresolvedHumanThreads
                  .length > 0
              ) {
                await disableAutoMerge(
                  prGraph.id,
                  !!prGraph.autoMergeRequest,
                  "có review thread chưa được resolve"
                );

                await addCommentOnce(
                  prNumber,
                  `<!-- pr-final-gate:unresolved-review:${currentHeadSha} -->`,
                  [
                    `<!-- pr-final-gate:unresolved-review:${currentHeadSha} -->`,
                    "không thể hợp nhất khi có reviewer",
                    "",
                    `Có ${reviewState.unresolvedHumanThreads.length} review thread của reviewer chưa được resolve.`,
                    "",
                    `Nhãn \`${readyLabel}\` được giữ nguyên; cần giải quyết review thread trước khi bật Auto-Merge.`
                  ].join("\n")
                );

                return;
              }

              /*
               * 5. A requested individual reviewer must either have
               * an approval already or remain a blocking pending review.
               */
              const requestedReviewers =
                (pr.requested_reviewers ||
                  [])
                  .map(user =>
                    user.login
                  )
                  .filter(Boolean);

              const pendingRequestedReviewers =
                requestedReviewers.filter(
                  login => {
                    const decisive =
                      reviewState
                        .latestDecisiveByReviewer
                        .get(login);

                    return (
                      !decisive ||
                      String(
                        decisive.state
                      ).toUpperCase() !==
                        "APPROVED"
                    );
                  }
                );

              if (
                pendingRequestedReviewers.length >
                0
              ) {
                await disableAutoMerge(
                  prGraph.id,
                  !!prGraph.autoMergeRequest,
                  "reviewer đã được request nhưng chưa APPROVED"
                );

                core.notice(
                  `Đang chờ reviewer: ${pendingRequestedReviewers.join(", ")}`
                );

                return;
              }

              /*
               * Team review requests are also a pending review gate.
               */
              const requestedTeams =
                pr.requested_teams || [];

              if (
                requestedTeams.length > 0
              ) {
                await disableAutoMerge(
                  prGraph.id,
                  !!prGraph.autoMergeRequest,
                  "team reviewer vẫn đang được request"
                );

                core.notice(
                  "Có team reviewer đang được request. Chưa bật Auto-Merge."
                );

                return;
              }

              /*
               * Refresh label one final time.
               * This prevents a race where someone removes the label
               * while CI/review checks are running.
               */
              pr =
                await getPullRequest(
                  prNumber
                );

              hasReadyLabel =
                (pr.labels || []).some(
                  label =>
                    label.name ===
                    readyLabel
                );

              if (!hasReadyLabel) {
                prGraph =
                  await getPullRequestGraphQL(
                    prNumber
                  );

                await disableAutoMerge(
                  prGraph.id,
                  !!prGraph.autoMergeRequest,
                  "label bị gỡ trong lúc Final Gate chạy"
                );

                core.notice(
                  `Label "${readyLabel}" không còn tồn tại.`
                );

                return;
              }

              /*
               * Refresh head SHA one last time.
               */
              if (
                pr.head.sha !==
                currentHeadSha
              ) {
                prGraph =
                  await getPullRequestGraphQL(
                    prNumber
                  );

                await disableAutoMerge(
                  prGraph.id,
                  !!prGraph.autoMergeRequest,
                  "HEAD SHA thay đổi trước khi bật Auto-Merge"
                );

                throw new Error(
                  "PR đã thay đổi commit trong lúc Final Gate chạy. Không bật Auto-Merge cho SHA cũ."
                );
              }

              /*
               * 6. Preserve existing technical approval behavior.
               */
              try {
                await approveIfNeeded(
                  prNumber,
                  currentHeadSha,
                  reviewState.reviews
                );
              } catch (error) {
                /*
                 * Approval is not the actual merge authorization.
                 * A failure here must not cause an unsafe direct merge.
                 * Continue only if all actual gates still pass.
                 */
                core.warning(
                  `Không thể tạo technical approval tự động: ${error.message || error}`
                );
              }

              /*
               * 7. Re-check PR state after the approval mutation.
               */
              const latestPr =
                await getPullRequest(
                  prNumber
                );

              if (
                latestPr.state !==
                "open"
              ) {
                core.notice(
                  "PR không còn mở. Dừng Final Gate."
                );
                return;
              }

              if (
                latestPr.head.sha !==
                currentHeadSha
              ) {
                prGraph =
                  await getPullRequestGraphQL(
                    prNumber
                  );

                await disableAutoMerge(
                  prGraph.id,
                  !!prGraph.autoMergeRequest,
                  "HEAD SHA thay đổi sau khi đánh giá"
                );

                throw new Error(
                  "HEAD SHA đã thay đổi trước bước Auto-Merge."
                );
              }

              const latestLabels =
                new Set(
                  (latestPr.labels || [])
                    .map(label =>
                      label.name
                    )
                );

              if (
                !latestLabels.has(
                  readyLabel
                )
              ) {
                prGraph =
                  await getPullRequestGraphQL(
                    prNumber
                  );

                await disableAutoMerge(
                  prGraph.id,
                  !!prGraph.autoMergeRequest,
                  "label bị gỡ ngay trước Auto-Merge"
                );

                return;
              }

              /*
               * 8. Final GraphQL state.
               */
              prGraph =
                await getPullRequestGraphQL(
                  prNumber
                );

              if (prGraph.isDraft) {
                await disableAutoMerge(
                  prGraph.id,
                  !!prGraph.autoMergeRequest,
                  "PR trở thành Draft"
                );

                return;
              }

              if (
                prGraph.mergeable ===
                "CONFLICTING"
              ) {
                await disableAutoMerge(
                  prGraph.id,
                  !!prGraph.autoMergeRequest,
                  "PR đang conflict"
                );

                throw new Error(
                  "PR đang bị conflict ngay trước khi bật Auto-Merge."
                );
              }

              /*
               * Final CI invariant: re-read the required CI evidence
               * immediately before changing merge state. This guarantees
               * Auto-Merge is never newly enabled while required CI is
               * still pending.
               */
              const finalCi =
                await waitForAllCIToSettle(
                  currentHeadSha
                );

              if (!finalCi?.requiredCiComplete) {
                throw new Error(
                  "CI bắt buộc chưa hoàn tất ở lần kiểm tra cuối; không bật Auto-Merge."
                );
              }
              /*
               * 9. Enable Auto-Merge only.
               *
               * IMPORTANT:
               * There is deliberately NO REST merge fallback.
               * A failed Auto-Merge mutation must never become an
               * immediate merge.
               */
              await enableAutoMerge(
                prGraph.id,
                currentHeadSha,
                prNumber
              );

              core.notice(
                [
                  `✅ Final Gate hoàn tất cho PR #${prNumber}.`,
                  "CI bắt buộc đã pass.",
                  `Label "${readyLabel}" vẫn tồn tại.`,
                  "Không có reviewer COMMENTED/CHANGES_REQUESTED đang blocking.",
                  "Không có review thread của người dùng chưa resolve.",
                  "PR không conflict.",
                  `Auto-Merge=${mergeMethod}.`
                ].join(" ")
              );
            }

            await main();
