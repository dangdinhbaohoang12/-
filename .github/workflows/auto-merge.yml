name: PR Final Gate - Auto Merge

# This workflow is intentionally standalone.
# It never checks out or executes PR code.
# It only reads GitHub metadata/checks/reviews and performs PR/label/auto-merge operations.

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled

  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed

  pull_request_review_comment:
    types:
      - created
      - edited
      - deleted

  issue_comment:
    types:
      - created
      - edited
      - deleted

  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to evaluate
        required: true
        type: number

permissions:
  actions: read
  checks: read
  contents: write
  issues: read
  pull-requests: write

concurrency:
  group: pr-final-gate-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || 'unknown' }}
  cancel-in-progress: true

jobs:
  final-gate:
    name: Final PR gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Evaluate CI, reviews, label, conflicts, and auto-merge
        uses: actions/github-script@v8
        env:
          READY_LABEL: "sẵn sàng hợp nhất"
          MERGE_METHOD: "SQUASH"
          MAX_CI_WAIT_SECONDS: "900"
          POLL_INTERVAL_SECONDS: "20"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          script: |
            const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const readyLabel = process.env.READY_LABEL;
            const mergeMethod = process.env.MERGE_METHOD || "SQUASH";
            const maxCiWaitSeconds = Number(
              process.env.MAX_CI_WAIT_SECONDS || "900"
            );
            const pollIntervalSeconds = Number(
              process.env.POLL_INTERVAL_SECONDS || "20"
            );

            const allowedConclusions = new Set([
              "SUCCESS",
              "NEUTRAL",
              "SKIPPED"
            ]);

            const blockingConclusions = new Set([
              "FAILURE",
              "CANCELLED",
              "TIMED_OUT",
              "ACTION_REQUIRED",
              "STALE",
              "STARTUP_FAILURE"
            ]);

            function isBotUser(user) {
              return (
                user?.type === "Bot" ||
                /\[bot\]$/i.test(user?.login || "")
              );
            }

            function getPullRequestNumber() {
              if (
                context.eventName === "pull_request_target" ||
                context.eventName === "pull_request_review" ||
                context.eventName === "pull_request_review_comment"
              ) {
                return context.payload.pull_request?.number || null;
              }

              if (context.eventName === "issue_comment") {
                return context.payload.issue?.pull_request
                  ? context.payload.issue.number
                  : null;
              }

              if (context.eventName === "workflow_dispatch") {
                const value =
                  context.payload.inputs?.pr_number ||
                  core.getInput("pr_number");

                const number = Number(value);

                return Number.isInteger(number) && number > 0
                  ? number
                  : null;
              }

              return null;
            }

            async function getPullRequest(prNumber) {
              const data = await github.graphql(
                `
                  query(
                    $owner: String!
                    $repo: String!
                    $number: Int!
                  ) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        id
                        number
                        title
                        state
                        draft
                        mergeable
                        author {
                          login
                        }
                        headRefOid
                        labels(first: 100) {
                          nodes {
                            name
                          }
                        }
                        autoMergeRequest {
                          enabledAt
                          mergeMethod
                        }
                      }
                    }
                  }
                `,
                {
                  owner,
                  repo,
                  number: prNumber
                }
              );

              return data.repository.pullRequest;
            }

            async function waitForMergeableState(prNumber) {
              const start = Date.now();

              while (true) {
                const pr = await getPullRequest(prNumber);

                if (pr.mergeable !== "UNKNOWN") {
                  return pr;
                }

                if (
                  (Date.now() - start) / 1000 >
                  Math.min(maxCiWaitSeconds, 120)
                ) {
                  throw new Error(
                    "GitHub vẫn trả về trạng thái mergeable=UNKNOWN sau thời gian chờ."
                  );
                }

                console.log(
                  "GitHub chưa xác định trạng thái mergeable. Đang chờ..."
                );

                await sleep(5000);
              }
            }

            async function getAllCheckRuns(headSha) {
              const checkRuns = [];

              let page = 1;

              while (true) {
                const response =
                  await github.rest.checks.listForRef({
                    owner,
                    repo,
                    ref: headSha,
                    per_page: 100,
                    page
                  });

                checkRuns.push(...(response.data.check_runs || []));

                if (response.data.check_runs.length < 100) {
                  break;
                }

                page++;
              }

              return checkRuns;
            }

            async function getCombinedStatus(headSha) {
              const response =
                await github.rest.repos.getCombinedStatusForRef({
                  owner,
                  repo,
                  ref: headSha
                });

              return response.data;
            }

            async function waitForAllCIToSettle(prNumber, headSha) {
              const startTime = Date.now();

              while (true) {
                const checkRuns = await getAllCheckRuns(headSha);
                const combinedStatus = await getCombinedStatus(headSha);

                const currentRunId = context.runId;

                const relevantCheckRuns = checkRuns.filter((check) => {
                  // Do not let this Final Gate workflow block itself.
                  if (
                    check.name === "Final PR gate" &&
                    check.external_id &&
                    String(check.external_id).includes(String(currentRunId))
                  ) {
                    return false;
                  }

                  return true;
                });

                const pendingChecks = relevantCheckRuns.filter(
                  (check) => check.status !== "completed"
                );

                const failedChecks = relevantCheckRuns.filter((check) =>
                  blockingConclusions.has(
                    String(check.conclusion || "").toUpperCase()
                  )
                );

                const unexpectedChecks = relevantCheckRuns.filter((check) => {
                  if (check.status !== "completed") {
                    return false;
                  }

                  const conclusion = String(
                    check.conclusion || ""
                  ).toUpperCase();

                  return (
                    conclusion &&
                    !allowedConclusions.has(conclusion) &&
                    !blockingConclusions.has(conclusion)
                  );
                });

                const pendingStatuses =
                  (combinedStatus.statuses || []).filter(
                    (status) => status.state === "pending"
                  );

                const failedStatuses =
                  (combinedStatus.statuses || []).filter((status) =>
                    ["failure", "error"].includes(status.state)
                  );

                console.log(
                  [
                    `CI status for SHA ${headSha}:`,
                    `checks=${relevantCheckRuns.length}`,
                    `pendingChecks=${pendingChecks.length}`,
                    `failedChecks=${failedChecks.length}`,
                    `pendingStatuses=${pendingStatuses.length}`,
                    `failedStatuses=${failedStatuses.length}`
                  ].join(" ")
                );

                if (failedChecks.length > 0) {
                  const names = failedChecks
                    .map(
                      (check) =>
                        `${check.name} (${check.conclusion})`
                    )
                    .join(", ");

                  throw new Error(
                    `CI thất bại: ${names}`
                  );
                }

                if (failedStatuses.length > 0) {
                  const names = failedStatuses
                    .map((status) => status.context)
                    .join(", ");

                  throw new Error(
                    `GitHub Status thất bại: ${names}`
                  );
                }

                if (unexpectedChecks.length > 0) {
                  const names = unexpectedChecks
                    .map(
                      (check) =>
                        `${check.name} (${check.conclusion})`
                    )
                    .join(", ");

                  throw new Error(
                    `CI có conclusion không được phép: ${names}`
                  );
                }

                if (
                  pendingChecks.length === 0 &&
                  pendingStatuses.length === 0
                ) {
                  console.log(
                    "Tất cả check/status liên quan đến commit hiện tại đã hoàn thành."
                  );

                  return;
                }

                if (
                  (Date.now() - startTime) / 1000 >
                  maxCiWaitSeconds
                ) {
                  throw new Error(
                    `Timeout (${maxCiWaitSeconds}s) khi chờ CI hoàn thành.`
                  );
                }

                console.log(
                  `Đang chờ ${pendingChecks.length + pendingStatuses.length} check/status...`
                );

                await sleep(pollIntervalSeconds * 1000);
              }
            }

            async function getReviewThreads(prNumber) {
              const threads = [];
              let after = null;

              do {
                const data = await github.graphql(
                  `
                    query(
                      $owner: String!
                      $repo: String!
                      $number: Int!
                      $after: String
                    ) {
                      repository(owner: $owner, name: $repo) {
                        pullRequest(number: $number) {
                          reviewThreads(
                            first: 100
                            after: $after
                          ) {
                            nodes {
                              isResolved
                              comments(first: 1) {
                                nodes {
                                  author {
                                    login
                                    __typename
                                  }
                                  body
                                  path
                                  line
                                  url
                                }
                              }
                            }
                            pageInfo {
                              hasNextPage
                              endCursor
                            }
                          }
                        }
                      }
                    }
                  `,
                  {
                    owner,
                    repo,
                    number: prNumber,
                    after
                  }
                );

                const connection =
                  data.repository.pullRequest.reviewThreads;

                threads.push(...(connection.nodes || []));

                after = connection.pageInfo.hasNextPage
                  ? connection.pageInfo.endCursor
                  : null;
              } while (after);

              return threads;
            }

            async function checkReviews(prNumber, prAuthorLogin) {
              const reviews = [];
              let page = 1;

              while (true) {
                const response =
                  await github.rest.pulls.listReviews({
                    owner,
                    repo,
                    pull_number: prNumber,
                    per_page: 100,
                    page
                  });

                reviews.push(...(response.data || []));

                if (response.data.length < 100) {
                  break;
                }

                page++;
              }

              const humanReviews = reviews.filter((review) => {
                const user = review.user;

                return (
                  !!user?.login &&
                  user.login !== prAuthorLogin &&
                  !isBotUser(user)
                );
              });

              const changesRequested = humanReviews.filter(
                (review) =>
                  String(review.state).toUpperCase() ===
                  "CHANGES_REQUESTED"
              );

              const latestByReviewer = new Map();

              for (const review of humanReviews) {
                const login = review.user.login;

                latestByReviewer.set(login, review);
              }

              const latestReviews = [...latestByReviewer.values()];

              const blockingLatestReviews =
                latestReviews.filter(
                  (review) =>
                    String(review.state).toUpperCase() ===
                    "CHANGES_REQUESTED"
                );

              if (changesRequested.length > 0) {
                const names = [
                  ...new Set(
                    changesRequested.map(
                      (review) => review.user.login
                    )
                  )
                ];

                throw new Error(
                  `PR có review CHANGES_REQUESTED từ: ${names.join(", ")}`
                );
              }

              if (blockingLatestReviews.length > 0) {
                const names = blockingLatestReviews.map(
                  (review) => review.user.login
                );

                throw new Error(
                  `Reviewer hiện tại vẫn yêu cầu thay đổi: ${names.join(", ")}`
                );
              }

              const threads = await getReviewThreads(prNumber);

              const unresolvedHumanThreads = threads.filter(
                (thread) => {
                  if (thread.isResolved) {
                    return false;
                  }

                  const author =
                    thread.comments?.nodes?.[0]?.author;

                  return (
                    author &&
                    author.login !== prAuthorLogin &&
                    !isBotUser(author)
                  );
                }
              );

              if (unresolvedHumanThreads.length > 0) {
                console.log(
                  `Có ${unresolvedHumanThreads.length} review thread chưa được resolve.`
                );
              }

              console.log(
                `Review check: ${humanReviews.length} review của người dùng khác tác giả.`
              );

              return {
                humanReviews,
                latestReviews,
                unresolvedHumanThreads
              };
            }

            async function enableAutoMerge(pr) {
              if (pr.autoMergeRequest) {
                console.log(
                  `Auto-Merge đã được bật trước đó với phương thức ${pr.autoMergeRequest.mergeMethod}.`
                );

                return;
              }

              console.log(
                `Đang bật Auto-Merge bằng phương thức ${mergeMethod}...`
              );

              const mutation = `
                mutation(
                  $pullRequestId: ID!
                  $mergeMethod: PullRequestMergeMethod!
                ) {
                  enablePullRequestAutoMerge(
                    input: {
                      pullRequestId: $pullRequestId
                      mergeMethod: $mergeMethod
                    }
                  ) {
                    pullRequest {
                      autoMergeRequest {
                        enabledAt
                        mergeMethod
                      }
                    }
                  }
                }
              `;

              try {
                const result = await github.graphql(
                  mutation,
                  {
                    pullRequestId: pr.id,
                    mergeMethod
                  }
                );

                const autoMerge =
                  result.enablePullRequestAutoMerge
                    ?.pullRequest
                    ?.autoMergeRequest;

                if (!autoMerge) {
                  throw new Error(
                    "GitHub không trả về autoMergeRequest sau khi bật Auto-Merge."
                  );
                }

                console.log(
                  `🎉 Auto-Merge đã được bật cho PR #${pr.number}.`
                );

                console.log(
                  `Phương thức merge: ${autoMerge.mergeMethod}`
                );
              } catch (error) {
                // IMPORTANT:
                // Do NOT fall back to REST merge.
                // REST merge would merge immediately and could bypass
                // the intended Auto-Merge/branch-protection flow.
                throw new Error(
                  `Không thể bật Auto-Merge cho PR #${pr.number}: ${error.message}`
                );
              }
            }

            async function main() {
              const prNumber = getPullRequestNumber();

              if (!prNumber) {
                console.log(
                  "Không tìm thấy số PR hợp lệ. Bỏ qua."
                );
                return;
              }

              console.log(
                `Đang phân tích PR #${prNumber}...`
              );

              let pr = await getPullRequest(prNumber);

              if (!pr) {
                throw new Error(
                  `Không tìm thấy PR #${prNumber}.`
                );
              }

              if (pr.state !== "OPEN") {
                console.log(
                  `PR #${prNumber} không còn mở (${pr.state}). Bỏ qua.`
                );
                return;
              }

              if (pr.draft) {
                console.log(
                  `PR #${prNumber} vẫn đang ở trạng thái Draft. Bỏ qua.`
                );
                return;
              }

              const labels = (pr.labels?.nodes || []).map(
                (label) => label.name
              );

              if (!labels.includes(readyLabel)) {
                console.log(
                  `PR chưa có nhãn '${readyLabel}'. Bỏ qua.`
                );
                return;
              }

              console.log(
                `Đã tìm thấy nhãn '${readyLabel}'.`
              );

              const headSha = pr.headRefOid;

              if (!headSha) {
                throw new Error(
                  "Không lấy được HEAD SHA của PR."
                );
              }

              console.log(
                `HEAD SHA hiện tại: ${headSha}`
              );

              // 1. Wait for all CI/checks for the CURRENT commit.
              await waitForAllCIToSettle(
                prNumber,
                headSha
              );

              // 2. Re-read PR after CI because the PR may have changed
              // while CI was running.
              pr = await waitForMergeableState(prNumber);

              if (pr.headRefOid !== headSha) {
                throw new Error(
                  "HEAD SHA của PR đã thay đổi trong lúc chờ CI. Không bật Auto-Merge cho commit cũ."
                );
              }

              // 3. Check reviews.
              await checkReviews(
                prNumber,
                pr.author?.login || ""
              );

              // 4. Re-check mergeable state.
              if (pr.mergeable === "CONFLICTING") {
                throw new Error(
                  "PR đang bị xung đột (CONFLICTING). Không thể bật Auto-Merge."
                );
              }

              if (pr.mergeable !== "MERGEABLE") {
                throw new Error(
                  `PR chưa ở trạng thái MERGEABLE. Trạng thái hiện tại: ${pr.mergeable}`
                );
              }

              // 5. Final label check after all asynchronous work.
              const finalLabels = (pr.labels?.nodes || []).map(
                (label) => label.name
              );

              if (!finalLabels.includes(readyLabel)) {
                console.log(
                  `Nhãn '${readyLabel}' đã bị gỡ trong lúc kiểm tra. Không bật Auto-Merge.`
                );
                return;
              }

              // 6. Enable Auto-Merge only.
              // Never directly merge as a fallback.
              await enableAutoMerge(pr);

              console.log(
                `✅ Final Gate hoàn tất cho PR #${prNumber}.`
              );
              console.log(
                "CI đã pass, nhãn hợp lệ, review không yêu cầu thay đổi, PR không conflict và Auto-Merge đã được bật."
              );
            }

            await main();
