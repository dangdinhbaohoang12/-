name: Kiểm tra bảo mật với zizmor

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  zizmor:
    name: Quét GitHub Actions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write 

    steps:
      - name: Kiểm tra mã nguồn (Checkout)
        uses: actions/checkout@v4

      - name: Cài đặt và Chạy zizmor
        uses: woodruffw/zizmor-action@v1
        with:
          arguments: "--format sarif .github/workflows/"
          output: "zizmor-results.sarif"
          # Bỏ qua lỗi để bước sau vẫn có thể chạy và hiển thị cảnh báo
          fail-on-severity: "error" 

      - name: Đẩy kết quả lên GitHub Code Scanning
        # Kiểm tra nếu PR đến từ một bản Fork thì sẽ bỏ qua bước upload để tránh lỗi phân quyền
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "zizmor-results.sarif"
